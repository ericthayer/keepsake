<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Keepsake forms</title></head>
<body>
<!-- Netlify Forms skeleton for client-rendered forms. Field names must match lib/feedback.ts. -->
<form name="keepsake-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="keepsake-feedback">
  <input type="hidden" name="subject">
  <input type="text" name="kind">
  <input type="email" name="email">
  <textarea name="message"></textarea>
  <input type="text" name="context">
  <input name="bot-field">
</form>
</body>
</html>
