[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Declared explicitly so the Next.js Runtime always runs. Without it the
# production build published the raw .next folder and every page returned 404.
# Unpinned on purpose: Netlify resolves the current runtime each build.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 3000
  framework = "#custom"

[[redirects]]
  from = "/signin-with-chatgpt"
  to = "/login"
  status = 302
